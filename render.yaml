services:
  - type: web
    name: bluetap-backend
    runtime: node
    buildCommand: npm ci
    startCommand: npm run start:backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APP_ENV
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: EMAIL_PROVIDER
        value: vercel-relay
      - key: VERCEL_MAIL_RELAY_URL
        sync: false
      - key: INTERNAL_MAIL_RELAY_SECRET
        sync: false
      - key: EMAIL_OTP_HASH_SECRET
        sync: false
      - key: DEEPFACE_API_URL
        sync: false
      - key: DEEPFACE_API_KEY
        sync: false
      - key: REGISTRATION_DEVICE_HASH_SECRET
        sync: false
      - key: REGISTRATION_IP_HASH_SECRET
        sync: false
